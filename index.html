<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Added to a home screen, the game opens without browser bars, which matters most sideways. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RUNSHIFT" />
    <meta name="theme-color" content="#1c2340" />
    <meta name="format-detection" content="telephone=no" />
    <title>RUNSHIFT</title>
    <link rel="icon" href="data:," />
    <style>
      /* Touch rules (from Rail in the Air): a swipe never scrolls, zooms, selects or bounces the page.
         touch-action goes on every element, as iOS Safari does not always take it from the root.
         A panel that must scroll opts out with .scrolls. */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        /* The visible viewport on phones, without the browser bars. Older browsers keep 100%. */
        height: 100dvh;
        overflow: hidden;
        background: #1c2340;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
      }
      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .hidden {
        display: none !important;
      }
      /* Browsers combine touch-action from the touched element up to the scroller, so the panel's children
         must allow the pan too. */
      .scrolls,
      .scrolls * {
        touch-action: pan-y;
      }
      .scrolls {
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      /* Boot screen, until the first frame is drawn. No inset or flex gap here: older phone browsers
         lack them, and this screen is what they show when they cannot start the game. */
      #boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1c2340; color: #fff4dd; font: 700 12px/1 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; letter-spacing: .3em; transition: opacity .5s ease-out; }
      #boot > * + * { margin-top: 20px; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot b { display: block; font: italic 900 52px/1 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; letter-spacing: .02em; color: #17b3a3; text-shadow: 0 4px 0 #0d1226; }
      #boot b em { font-style: inherit; color: #ff7a1f; }
      #boot i { position: relative; display: block; width: 180px; height: 4px; overflow: hidden; border-radius: 2px; background: #2c3560; }
      #boot i::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 2px; background: #ffbf2a; animation: boot 1.1s cubic-bezier(.77, 0, .175, 1) infinite; }
      #boot span { font-size: 10px; color: #8d93b8; margin-right: -.3em; }
      #boot.failed i, #boot.failed span { display: none; }
      #boot p { max-width: 86vw; margin-bottom: 0; font-size: 11px; line-height: 1.7; letter-spacing: .08em; text-align: center; color: #ff8f7a; }
      #boot p small { display: block; font-size: 10px; color: #8d93b8; }
      @keyframes boot { from { left: -40%; } to { left: 100%; } }
    </style>
    <script>
      // Runs before the game, in plain old JavaScript (ES5) so that any browser can: if the game cannot start
      // (a browser too old for it, a file that did not load), the boot screen says so, and which browser,
      // instead of loading forever. The game sets window.done once it is up (src/app/boot.ts).
      (function () {
        var failed = false;
        function browser() {
          var m = navigator.userAgent.match(/(MiuiBrowser|SamsungBrowser|Chrome|CriOS|Firefox|Version)\/(\d+)/);
          return m ? m[1].replace('Version', 'Safari') + ' ' + m[2] : navigator.userAgent;
        }
        /** A line under the logo (replacing any before it), with the browser's name and version under it. */
        function say(text) {
          var boot = document.getElementById('boot');
          if (!boot) return;
          var old = boot.getElementsByTagName('p')[0];
          if (old) boot.removeChild(old);
          var p = document.createElement('p');
          p.appendChild(document.createTextNode(text));
          var small = document.createElement('small');
          small.appendChild(document.createTextNode(browser()));
          p.appendChild(small);
          boot.appendChild(p);
        }
        window.bootFailed = function (err) {
          if (failed || window.done) return;
          failed = true;
          var boot = document.getElementById('boot');
          if (boot) boot.className = 'failed';
          say("THE GAME COULDN'T START: " + ((err && err.message) || err || 'AN ERROR'));
        };
        window.addEventListener('error', function (e) {
          window.bootFailed(e.error || e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          window.bootFailed(e.reason);
        });
        // Nothing went wrong that could be heard, but the game still is not up.
        setTimeout(function () {
          if (!window.done && !failed) say('STILL LOADING. ON A SLOW CONNECTION, GIVE IT A MOMENT. IF IT STAYS LIKE THIS, THIS BROWSER MAY BE TOO OLD: TRY AN UP-TO-DATE CHROME OR SAFARI');
        }, 30000);
      })();
    </script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="boot"><b>RUN<em>SHIFT</em></b><i></i><span>LOADING</span></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Only a browser too old for the game's script runs this. -->
    <script nomodule>window.bootFailed(new Error('THIS BROWSER IS TOO OLD FOR THE GAME. TRY AN UP-TO-DATE CHROME OR SAFARI'));</script>
  </body>
</html>
